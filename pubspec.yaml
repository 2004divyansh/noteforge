name: noteforge
description: A student-oriented cross-platform note-taking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: any
  sqlite3_flutter_libs: any
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_quill: ^11.6.0
  uuid: ^4.5.1
  intl: any
  share_plus: ^10.1.4
  pdf: ^3.11.2
  printing: ^5.13.5
  local_auth: ^2.3.0
  flex_color_scheme: ^8.1.1
  flutter_animate: ^4.5.2
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  cupertino_icons: ^1.0.8
  collection: ^1.18.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: any
  build_runner: any

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
